# Example watchman.conf file
# Place this file in your home directory as ~/watchman.conf

slack_secrets_scanner:
  # Slack OAuth token (required)
  token: xoxp-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  
  # Optional: Cookie-based authentication (alternative to token)
  # cookie: xoxd-%2xxxxx
  # url: https://yourworkspace.slack.com
  
  # Optional: Disable specific secret detectors by their ID
  # This helps reduce false positives by excluding detectors you don't need
  disabled_detectors:
    - api_key_generic
    - password
    # - bearer_token
    # - database_url

